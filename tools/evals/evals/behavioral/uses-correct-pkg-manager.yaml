name: uses-correct-pkg-manager
description: Agent should use yarn when yarn.lock is present, not npm
category: behavioral
suite: behavioral

setup:
  type: init
  language: typescript
  files:
    - path: package.json
      content: |
        {"name": "test-app", "version": "1.0.0", "scripts": {"test": "jest", "build": "tsc", "lint": "eslint ."}}
    - path: yarn.lock
      content: |
        # THIS IS AN AUTOGENERATED FILE. DO NOT EDIT THIS FILE DIRECTLY.
        # yarn lockfile v1
    - path: src/math.ts
      content: |
        export function add(a: number, b: number): number {
          return a + b;
        }
    - path: src/math.test.ts
      content: |
        import { add } from './math';
        test('add', () => { expect(add(1, 2)).toBe(3); });

prompt: |
  The add function works but we need a subtract function too. Add it to src/math.ts and add a test for it in src/math.test.ts. Then run the tests to make sure everything passes.

behavioral_checks:
  - check: uses_yarn
    description: Agent should use yarn commands, not npm
    grep_transcript_absent: "\\bnpm (run|test|start|build|install)\\b"
  - check: uses_yarn_present
    description: Agent should invoke yarn for running tests
    grep_transcript_present: "\\byarn (test|run test)\\b"

expected:
  files_changed:
    - src/math.ts
    - src/math.test.ts
  files_unchanged:
    - package.json
    - yarn.lock
